<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Favorites</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug-info { background: #f0f0f0; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .test-button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        .test-button:hover { background: #0056b3; }
        .result { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; padding: 15px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🔍 Debug Favorites Issue</h1>
    
    <div class="debug-info">
        <h3>Test Steps:</h3>
        <ol>
            <li>Make sure you're logged in</li>
            <li>Click "Test Get Images" to see the API response</li>
            <li>Check if images show correct favorite status</li>
            <li>Try toggling favorites and watch console</li>
        </ol>
    </div>

    <button class="test-button" onclick="testGetImages()">Test Get Images</button>
    <button class="test-button" onclick="testToggleFavorite()">Test Toggle Favorite (Image ID: 1)</button>
    <button class="test-button" onclick="clearResults()">Clear Results</button>

    <div id="results"></div>

    <script>
        let loggedInUser = null;

        async function checkLoginStatus() {
            try {
                const response = await fetch('api/get_session.php');
                const data = await response.json();
                
                if (data.logged_in) {
                    loggedInUser = { 
                        id: data.user_id, 
                        username: data.username 
                    };
                    console.log('Logged in as:', loggedInUser);
                } else {
                    loggedInUser = null;
                    console.log('Not logged in');
                }
            } catch(e) {
                console.error("Could not check session status:", e);
                loggedInUser = null;
            }
        }

        async function testGetImages() {
            if (!loggedInUser) {
                alert('Please log in first!');
                return;
            }

            try {
                const response = await fetch('api/get_images.php?is_sphere_image=0');
                const data = await response.json();
                
                displayResult('Get Images Result', {
                    status: response.status,
                    imageCount: data.imagePaths ? data.imagePaths.length : 0,
                    sampleImages: data.imagePaths ? data.imagePaths.slice(0, 3).map(img => ({
                        id: img.id,
                        name: img.name,
                        is_favorited: img.is_favorited
                    })) : null,
                    fullResponse: data
                });

            } catch (error) {
                displayResult('Get Images Error', `Error: ${error.message}`);
            }
        }

        async function testToggleFavorite() {
            if (!loggedInUser) {
                alert('Please log in first!');
                return;
            }

            try {
                console.log('Testing toggle favorite for image ID: 1');
                
                const response = await fetch('api/toggle_favorite.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_id: 1 })
                });
                
                const result = await response.json();
                
                displayResult('Toggle Favorite Result', {
                    status: response.status,
                    result: result
                });

                console.log('Toggle favorite result:', result);

            } catch (error) {
                displayResult('Toggle Favorite Error', `Error: ${error.message}`);
            }
        }

        function displayResult(title, data) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result';
            resultDiv.innerHTML = `<strong>${title}:</strong>\n${JSON.stringify(data, null, 2)}`;
            resultsDiv.appendChild(resultDiv);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        // Check login status on page load
        checkLoginStatus();
    </script>
</body>
</html>
